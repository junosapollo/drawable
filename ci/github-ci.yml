name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check --workspace=@drawable/contracts
      - run: npm run check
      - run: npm test
      - run: npm run build

  python:
    name: Python · ruff, mypy, pytest (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ml
            module: linescout_ml
          - package: services/api
            module: linescout_api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: ${{ matrix.package }}
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[dev]"
      - name: Ruff
        working-directory: ${{ matrix.package }}
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Mypy
        working-directory: ${{ matrix.package }}
        run: .venv/bin/mypy ${{ matrix.module }}
      - name: Pytest
        working-directory: ${{ matrix.package }}
        run: .venv/bin/pytest -q

  synthetic-smoke:
    name: Synthetic-data smoke test
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install API (pulls in linescout-ml)
        working-directory: services/api
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[dev]"
      - name: Fixture is deterministic and valid
        working-directory: ml
        run: |
          ../services/api/.venv/bin/linescout-manifest synth --out /tmp/synth --count 24 --seed 7
          ../services/api/.venv/bin/linescout-manifest validate /tmp/synth/manifest.json --require-files
          ../services/api/.venv/bin/linescout-manifest validate fixtures/synthetic/manifest.json --require-files
          diff <(python3 -c "import json;print(json.dumps(json.load(open('/tmp/synth/manifest.json')),sort_keys=True))") \
               <(python3 -c "import json;print(json.dumps(json.load(open('fixtures/synthetic/manifest.json')),sort_keys=True))")
      - name: Contracts are up to date
        run: |
          npm ci
          services/api/.venv/bin/python scripts/export_openapi.py
          npm run generate --workspace=@drawable/contracts
          git diff --exit-code -- packages/contracts || {
            echo "::error::packages/contracts is stale. Run scripts/export_openapi.py and npm run generate --workspace=@drawable/contracts"; exit 1; }
      - name: Boot API against the synthetic gallery and run a search
        env:
          LINESCOUT_GALLERY_MANIFEST: ml/fixtures/synthetic/manifest.json
          LINESCOUT_DB_PATH: /tmp/smoke.sqlite3
          LINESCOUT_PORT: "8000"
        run: |
          services/api/.venv/bin/python -m linescout_api.main &
          API_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break; sleep 1; done
          services/api/.venv/bin/python scripts/smoke_search.py http://127.0.0.1:8000
          kill $API_PID
