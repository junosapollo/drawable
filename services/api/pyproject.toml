[project]
name = "linescout-api"
version = "0.1.0"
description = "LineScout local retrieval API: health, search, events, preferences, and asset serving."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pillow>=10.4",
    "linescout-ml",
]

[project.optional-dependencies]
# GPU/ML runtime arrives in Milestone 4. Keeping it optional means a fresh
# clone can run the Milestone 1 API with only the light dependencies above.
gpu = [
    "torch>=2.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
linescout-ml = { path = "../../ml", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linescout_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
